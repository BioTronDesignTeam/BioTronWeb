# The public edge: Nginx and the Cloudflare tunnel. It has its own lifecycle,
# apart from the Postgres and Redis in ../docker-compose.yml, so restarting or
# redeploying the data services and apps never touches the tunnel.
name: biotron-edge

services:
  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-biotron-}edge-nginx:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN in the environment}
    networks:
      edge:
        aliases:
          - nginx
      biotron:
        aliases:
          - edge-proxy
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/_edge/health | grep -qx ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    restart: unless-stopped
    command:
      - tunnel
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      - edge
    depends_on:
      nginx:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  biotron:
    external: true
    name: biotron

secrets:
  cloudflare_tunnel_token:
    environment: CLOUDFLARE_TUNNEL_TOKEN
