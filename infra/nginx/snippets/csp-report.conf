# Browsers POST Content-Security-Policy violation reports here: report-uri
# and report-to in sites/csp.template, and the Reporting-Endpoints
# header in nginx.conf. Each report becomes one csp-report line of the access
# log, holding the directive, the disposition, and the blocked and document
# addresses without their query strings. Nothing is stored.
location = /_edge/csp-report {
    limit_except POST { deny all; }
    limit_req zone=csp_reports burst=20 nodelay;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_in_single_buffer on;
    access_log /dev/stdout csp_report;
    # $request_body is only read for a proxied request. The sink in
    # sites/default.conf answers it with 204.
    proxy_pass http://127.0.0.1:8080/_edge/csp-sink;
    proxy_set_header Host csp-sink.invalid;
    proxy_set_header Cookie "";
}
