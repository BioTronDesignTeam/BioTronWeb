# Included in every server of an instance marked :noindex in EDGE_SITES, such
# as staging. The X-Robots-Tag header comes from the $robots_tag map in
# nginx.conf, so it is on every response, errors included; this answers
# robots.txt before the app can serve its production copy.
location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}
