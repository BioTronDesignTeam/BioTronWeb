proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;

# ORDER MATTERS -- do not delete this line while the backends trust the edge.
#
# The Go backends read Cf-Connecting-Ip for every per-IP rate-limit key and
# every access-log client address, but only from a peer in TRUSTED_PROXIES:
# the edge's fixed address on each instance network. Setting it here
# overwrites whatever the client sent with $remote_addr, which the realip
# module (nginx.conf) took from Cf-Connecting-Ip only on a connection from
# cloudflared's network, so the edge is the only source of the value.
#
# Without this line the backends must NOT trust the edge: nginx would forward a
# client-supplied Cf-Connecting-IP verbatim, letting anyone pick their own
# rate-limit bucket and forge the source IP in the logs.
proxy_set_header Cf-Connecting-Ip $remote_addr;

proxy_set_header X-Request-ID $request_id;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# The edge owns the security headers (nginx.conf, http level). Some product
# containers set their own -- Biotron-Site sends X-Frame-Options: SAMEORIGIN --
# and add_header appends rather than replaces, so without this the site's
# responses would carry two conflicting X-Frame-Options values, which browsers
# treat as malformed. Drop the upstream copies and let the edge's stand.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 3600s;
