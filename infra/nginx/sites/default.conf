# Requests for a hostname that no instance in EDGE_SITES claims.
server {
    listen 8080 default_server;
    server_name _;

    include /etc/nginx/snippets/edge-health.conf;

    # The CSP reports that each site's csp-report location proxies here, to
    # read their body. It answers only the edge itself.
    location = /_edge/csp-sink {
        allow 127.0.0.1;
        deny all;
        access_log off;
        return 204;
    }

    location / {
        return 404;
    }
}
