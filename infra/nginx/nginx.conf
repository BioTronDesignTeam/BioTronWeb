user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format biotron escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"client_ip":"$client_ip",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"cf_ray":"$http_cf_ray"}';

    access_log /dev/stdout biotron;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_cf_connecting_ip $client_ip {
        default $http_cf_connecting_ip;
        '' $remote_addr;
    }

    # HSTS must only be advertised on responses to requests that really arrived
    # over TLS. This edge listens on plain HTTP behind cloudflared, so $scheme is
    # always "http" here and Cloudflare's X-Forwarded-Proto is the only truthful
    # signal. nginx omits an add_header whose value evaluates to the empty
    # string, so a plain-http request (a local `curl` against the edge, the
    # container healthcheck) gets no Strict-Transport-Security at all.
    map $http_x_forwarded_proto $hsts_value {
        default '';
        https    'max-age=31536000; includeSubDomains';
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Security headers are set once here, at http level, so every vhost inherits
    # them. nginx does NOT merge add_header across levels: any server or location
    # block that declares an add_header of its own silently discards every
    # inherited one. So if a header ever has to be added deeper down, repeat this
    # whole set there too.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $hsts_value always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Enforced CSP, deliberately limited to directives that cannot break a
    # working page: none of them govern where scripts, styles, images or fetches
    # may come from. frame-ancestors is the clickjacking control X-Frame-Options
    # above only approximates, and it must be enforced rather than report-only
    # because frame-ancestors is not honoured in a Report-Only policy.
    # form-action is safe because every form in every frontend is submitted by
    # JavaScript and none declares an action attribute, and base-uri because no
    # index.html contains a <base> tag.
    #
    # The resource-loading half of the policy is shipped separately, in
    # Report-Only mode -- see conf.d/security-headers.conf (generated from
    # templates/security-headers.conf.template).
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

    include /etc/nginx/conf.d/*.conf;
}
