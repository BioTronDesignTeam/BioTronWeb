user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep the original public path through API rewrites without recording
    # query parameters such as OAuth authorization codes and state.
    map $request_uri $request_path {
        ~^(?<path_without_args>[^?]*) $path_without_args;
    }

    log_format biotron escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"client_ip":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_path",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"cf_ray":"$http_cf_ray"}';

    access_log /dev/stdout biotron;

    # Content-Security-Policy violation reports (snippets/csp-report.conf).
    # Only these fields of a report reach the log, each address cut at its
    # query string, which can hold an OAuth code. Both report formats are
    # read: report-uri's kebab-case and report-to's camelCase.
    map $request_body $csp_directive {
        default '';
        '~"(?:effective-directive|effectiveDirective|violated-directive)":"(?<v>[^"]{1,100})' $v;
    }
    map $request_body $csp_disposition {
        default '';
        '~"disposition":"(?<v>[a-z-]{1,20})"' $v;
    }
    map $request_body $csp_blocked {
        default '';
        '~"(?:blocked-uri|blockedURL)":"(?<v>[^"?#]{0,300})' $v;
    }
    map $request_body $csp_document {
        default '';
        '~"(?:document-uri|documentURL)":"(?<v>[^"?#]{0,300})' $v;
    }
    log_format csp_report escape=json
        '{"time":"$time_iso8601",'
        '"type":"csp-report",'
        '"host":"$host",'
        '"directive":"$csp_directive",'
        '"disposition":"$csp_disposition",'
        '"blocked":"$csp_blocked",'
        '"document":"$csp_document"}';
    limit_req_zone $binary_remote_addr zone=csp_reports:1m rate=5r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # The client's address. cloudflared sends it in Cf-Connecting-Ip, and the
    # realip module takes it from there only on a connection from the edge's
    # own network (set_real_ip_from in conf.d/02-real-ip.conf, which
    # 40-biotron-sites.sh writes from EDGE_SUBNET). Anyone else, such as a
    # container on an instance network, cannot choose its own: $remote_addr
    # stays the address it connected from.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # HSTS must only be advertised on responses to requests that really arrived
    # over TLS. This edge listens on plain HTTP behind cloudflared, so $scheme is
    # always "http" here and Cloudflare's X-Forwarded-Proto is the only truthful
    # signal. nginx omits an add_header whose value evaluates to the empty
    # string, so a plain-http request (a local `curl` against the edge, the
    # container healthcheck) gets no Strict-Transport-Security at all.
    #
    # Five minutes, for this domain only, and never preload, as AGENTS.md
    # asks of a first rollout: browsers keep HSTS for the whole max-age, so a
    # mistake must expire quickly. Raise it only once `curl -sI` against both
    # domains has shown it right for a while.
    map $http_x_forwarded_proto $hsts_value {
        default '';
        https    'max-age=300';
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # A redirect such as /api to /api/ keeps the browser's own scheme, host,
    # and port. Behind cloudflared, an absolute one would name this
    # listener: http://<host>:8080/api/.
    absolute_redirect off;
    client_max_body_size 10m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Security headers are set once here, at http level, so every vhost inherits
    # them. nginx does NOT merge add_header across levels: any server or location
    # block that declares an add_header of its own silently discards every
    # inherited one. So if a header ever has to be added deeper down, repeat this
    # whole set there too.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $hsts_value always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The document-level CSP, the same for every deployment, limited to
    # directives that govern nothing of where scripts, styles, images or fetches
    # may come from. frame-ancestors is the clickjacking control X-Frame-Options
    # above only approximates, and it must be enforced rather than report-only
    # because frame-ancestors is not honoured in a Report-Only policy.
    # form-action is safe because every form in every frontend is submitted by
    # JavaScript and none declares an action attribute, and base-uri because no
    # index.html contains a <base> tag.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

    # The resource-loading half of the policy, also enforced, names each
    # instance's own subdomains and the inline theme bootstrap's hash: see
    # sites/csp.template. The map comes from conf.d/01-maps.conf, which
    # 40-biotron-sites.sh writes; an unknown host gets no header. A browser
    # enforces both Content-Security-Policy headers.
    add_header Content-Security-Policy $csp_policy always;
    # Where report-to sends violations: the edge itself (snippets/csp-report.conf).
    add_header Reporting-Endpoints 'csp="/_edge/csp-report"' always;

    # X-Robots-Tag: noindex, nofollow on every response from an instance marked
    # :noindex in EDGE_SITES, such as staging; production sends none. Also from
    # conf.d/01-maps.conf.
    add_header X-Robots-Tag $robots_tag always;

    include /etc/nginx/conf.d/*.conf;
}
