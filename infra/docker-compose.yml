# Postgres for one instance. The root docker-compose.yml includes this
# file, so an instance's data services and apps form one Compose project:
# `biotron` locally, `biotron-<instance>` from `./launch --instance <instance>`.
# The edge Nginx and tunnel live in edge/docker-compose.yml and the secrets
# manager in infisical/docker-compose.yml, each with its own lifecycle.
# BIOTRON_NETWORK and BIOTRON_INSTANCE keep two instances on one host apart;
# ./launch sets both and creates the external network.
name: biotron-infrastructure

services:
  postgres:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biotron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-biotron}
      SPRINTER_READER_PASSWORD: ${SPRINTER_READER_PASSWORD:-}
      # Each app's own role (postgres/init/05-app-roles.sh).
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
      CALENDAR_DB_PASSWORD: ${CALENDAR_DB_PASSWORD:-}
      SPRINTER_DB_PASSWORD: ${SPRINTER_DB_PASSWORD:-}
    volumes:
      # Postgres 18 images store data in a major-version-specific directory
      # (PGDATA=/var/lib/postgresql/18/docker) and expect a single mount one
      # level up, at /var/lib/postgresql, so pg_upgrade can see both the old
      # and new cluster inside one mount point. Mounting the old
      # /var/lib/postgresql/data path instead makes the entrypoint refuse to
      # start. See "Postgres major upgrades" in README.md.
      - postgres-data:/var/lib/postgresql
      # Creates the app roles and sprinter_reader on a fresh cluster. The
      # postgres-roles service below runs the same scripts on every start.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP: while the image runs its init scripts, Postgres listens on
      # its socket only, and must not count as ready to the services below.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - biotron

  # Brings the roles of postgres/init up to date on every start of an
  # instance, before any migration runs, so an existing cluster gets new roles
  # and a password changed in Infisical reaches the database at the next
  # deploy. It runs the init scripts over the network as the owner.
  postgres-roles:
    # The postgres service's own image; scripts/check-images keeps them one.
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER:-biotron}
      POSTGRES_DB: ${POSTGRES_DB:-biotron}
      SPRINTER_READER_PASSWORD: ${SPRINTER_READER_PASSWORD:-}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
      CALENDAR_DB_PASSWORD: ${CALENDAR_DB_PASSWORD:-}
      SPRINTER_DB_PASSWORD: ${SPRINTER_DB_PASSWORD:-}
    volumes:
      - ./postgres/init:/init:ro
    entrypoint: ["bash", "-ec", "for script in /init/*.sh; do bash \"$$script\"; done"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - biotron
    restart: "no"

networks:
  biotron:
    external: true
    name: ${BIOTRON_NETWORK:-biotron}

# Named by instance, not by project, so a laptop keeps the volume it had
# before the data services joined the root project.
volumes:
  postgres-data:
    name: biotron-${BIOTRON_INSTANCE:-infrastructure}_postgres-data
