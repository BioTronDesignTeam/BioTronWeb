name: biotron-infrastructure

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${NGINX_IMAGE:-biotron-edge-nginx:local}
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN in .env}
    networks:
      edge:
        aliases:
          - nginx
      biotron:
        aliases:
          - edge-proxy
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/_edge/health | grep -qx ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    restart: unless-stopped
    command:
      - tunnel
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      - edge
    depends_on:
      nginx:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biotron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-biotron}
      SPRINTER_READER_PASSWORD: ${SPRINTER_READER_PASSWORD:?set SPRINTER_READER_PASSWORD in .env}
    volumes:
      # Postgres 18 images store data in a major-version-specific directory
      # (PGDATA=/var/lib/postgresql/18/docker) and expect a single mount one
      # level up, at /var/lib/postgresql, so pg_upgrade can see both the old
      # and new cluster inside one mount point. Mounting the old
      # /var/lib/postgresql/data path instead makes the entrypoint refuse to
      # start. See the Postgres 16 to 18 section in README.md.
      - postgres-data:/var/lib/postgresql
      # Creates sprinter_reader on a fresh cluster only. See the "Read-only
      # role for Sprinter" section in README.md.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - biotron

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - biotron

networks:
  edge:
    name: biotron-edge
  biotron:
    name: biotron

volumes:
  postgres-data:
  redis-data:

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:?set CLOUDFLARE_TUNNEL_TOKEN_FILE in .env}
