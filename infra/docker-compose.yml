# Postgres and Redis. The edge Nginx and tunnel live in edge/docker-compose.yml
# and the secrets manager in infisical/docker-compose.yml, each with its own
# lifecycle. The `biotron` network is external so the apps, the edge, and this
# file can start in any order; ./launch creates it.
name: biotron-infrastructure

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biotron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: ${POSTGRES_DB:-biotron}
      SPRINTER_READER_PASSWORD: ${SPRINTER_READER_PASSWORD:?set SPRINTER_READER_PASSWORD in the environment}
    volumes:
      # Postgres 18 images store data in a major-version-specific directory
      # (PGDATA=/var/lib/postgresql/18/docker) and expect a single mount one
      # level up, at /var/lib/postgresql, so pg_upgrade can see both the old
      # and new cluster inside one mount point. Mounting the old
      # /var/lib/postgresql/data path instead makes the entrypoint refuse to
      # start. See the Postgres 16 to 18 section in README.md.
      - postgres-data:/var/lib/postgresql
      # Creates sprinter_reader on a fresh cluster only. See the "Read-only
      # role for Sprinter" section in README.md.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - biotron

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - biotron

networks:
  biotron:
    external: true
    name: biotron

volumes:
  postgres-data:
  redis-data:
