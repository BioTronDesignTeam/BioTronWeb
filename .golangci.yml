# One configuration for every Go module; golangci-lint finds it by walking up
# from the module it runs in. The default linter set, plus the linters below,
# which catch real bugs in plain net/http, pgx, and sqlc code and rarely flag
# idiomatic code. Every report is shown: the two max-issues settings turn off
# the default limits. Code generated by sqlc (marked "Code generated ... DO
# NOT EDIT.") is skipped by golangci-lint's default exclusions.
#
# The formatters run with the linters: `golangci-lint run` reports a file
# that is not formatted, and `golangci-lint fmt` rewrites it.
version: "2"

linters:
  enable:
    # Bugs
    - bodyclose # an HTTP response body that is never closed
    - durationcheck # two time.Durations multiplied together
    - errchkjson # json.Marshal errors dropped on types that can fail
    - errorlint # == or a type switch on a wrapped error
    - forcetypeassert # x.(T) without the ok form
    - gosec # injection, weak crypto, file modes, integer overflow
    - nilerr # returning nil right after checking err != nil
    - noctx # an outbound request or query with no context.Context
    - rowserrcheck # rows.Err() never checked after iterating
    - sqlclosecheck # rows or statements that are never closed
    - unparam # a parameter that always gets the same value
    # Style that is cheap to keep
    - copyloopvar # loop-variable copies that Go 1.22 made pointless
    - gocritic # a broad set of small correctness and style checks
    - intrange # `for i := 0; i < n; i++` where `for i := range n` fits
    - misspell
    - nolintlint # every //nolint comment names its linter and says why
    - unconvert # a conversion to the type the value already has
    - usestdlibvars # "GET" and 200 where http.MethodGet and http.StatusOK exist
    - usetesting # os.Setenv and context.Background in tests
    - wastedassign # a value assigned and never read
  settings:
    # `defer x.Close()` and `defer tx.Rollback(ctx)` are the idiom for
    # releasing a resource whose close error has nowhere useful to go, so
    # those calls are not reported. Everything else unchecked still is.
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/bwmarrin/discordgo.Session).Close
        - (*github.com/BioTronDesignTeam/oauth-manager/backend/internal/cache.Cache).Close
    nolintlint:
      # A nolint comment must name its linter and give a reason.
      require-specific: true
      require-explanation: true
    rowserrcheck:
      # The backends query with pgx, not database/sql.
      packages:
        - github.com/jackc/pgx/v5

  exclusions:
    rules:
      # Tests set loose file modes and read files from a test directory on
      # purpose, their secrets are made up (G101), the cookies of their fake
      # browsers need no attributes (G124), and errcheck already covers an
      # unhandled error (G104). httptest.NewRequest needs no context: the
      # request never leaves the process.
      - path: _test\.go
        linters:
          - gosec
        text: "G101|G104|G124|G302|G304|G306"
      - path: _test\.go
        linters:
          - noctx
        text: httptest.NewRequest

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # Imports of this organization's modules go in their own group, after
      # the standard library and third-party imports.
      local-prefixes:
        - github.com/BioTronDesignTeam
