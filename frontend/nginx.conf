server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # nginx's add_header does not merge across levels: as soon as a location
    # declares one, it drops every add_header inherited from the server block.
    # Both locations below need a Cache-Control, so both must repeat these three
    # or they serve no security headers at all. That is not hypothetical — the
    # SPA fallback rewrites to /index.html, which lands in the exact-match block
    # below, so a single unrepeated add_header stripped these from every
    # response the site served. Repeat them in any location you add.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Vite hashed assets — cache forever.
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # One Cache-Control only. `expires 1y` emits its own, so pairing it with
        # an explicit add_header sent the header twice on every asset.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback for react-router-dom BrowserRouter.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";
    }
}
