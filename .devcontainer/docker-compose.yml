# The development container and the Postgres every app depends on, so opening
# the devcontainer is the whole setup: no host Postgres, nothing to start by
# hand.
#
# postgres here is deliberately its own definition, not a reference to
# infra/docker-compose.yml. It may drift from it; when it does, a commit
# brings it back in line. Keep the images matching by hand.
# The service names and credentials are the ones every app's .env.example
# already uses, so a fresh clone works without editing anything.
name: biotron-dev

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    working_dir: /workspaces/biotron
    volumes:
      - ..:/workspaces/biotron:cached
      # The workspace is bind-mounted from the host, whose node_modules hold
      # the host's native binaries. Each node_modules is masked by a volume so
      # the container installs its own Linux ones without touching the host's.
      - nm-auth-frontend:/workspaces/biotron/apps/auth/frontend/node_modules
      - nm-auth-prisma:/workspaces/biotron/apps/auth/prisma/node_modules
      - nm-calendar-frontend:/workspaces/biotron/apps/calendar/frontend/node_modules
      - nm-calendar-prisma:/workspaces/biotron/apps/calendar/prisma/node_modules
      - nm-exo-frontend:/workspaces/biotron/apps/exo/frontend/node_modules
      - nm-logger-frontend:/workspaces/biotron/apps/logger/frontend/node_modules
      - nm-logger-prisma:/workspaces/biotron/apps/logger/prisma/node_modules
      - nm-site-frontend:/workspaces/biotron/apps/site/frontend/node_modules
      - nm-sprinter-frontend:/workspaces/biotron/apps/sprinter/frontend/node_modules
      - nm-sprinter-prisma:/workspaces/biotron/apps/sprinter/prisma/node_modules
      - nm-root:/workspaces/biotron/node_modules
      - nm-style:/workspaces/biotron/packages/style/node_modules
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: biotron
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: biotron
    volumes:
      # Postgres 18 keeps its data one level above the old path; see the note
      # in infra/docker-compose.yml.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biotron -d biotron"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  nm-auth-frontend:
  nm-auth-prisma:
  nm-calendar-frontend:
  nm-calendar-prisma:
  nm-exo-frontend:
  nm-logger-frontend:
  nm-logger-prisma:
  nm-site-frontend:
  nm-sprinter-frontend:
  nm-sprinter-prisma:
  nm-root:
  nm-style:
