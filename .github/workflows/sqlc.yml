# Checks that the committed sqlc code of every backend matches its queries
# and schema. For each apps/*/backend that has a sqlc config, `sqlc diff`
# generates the code in memory and fails when it differs from the files on
# disk: a query edited without running `sqlc generate`, or code generated by
# a different sqlc release (the header of each file names it). A backend
# with no sqlc config is skipped, so the job passes before any exists.
#
# sqlc runs with no database: keep `database:` out of each sqlc config (or
# set `analyzer: database: false`), so the schema is read from the files.
name: sqlc

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: sqlc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diff:
    name: sqlc diff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The sqlc image that .devcontainer/Dockerfile copies its sqlc from, by
      # the same digest, so `sqlc generate` in the devcontainer writes what
      # this job expects. Dependabot updates that FROM line.
      - name: diff the generated code
        run: |
          image=$(sed -nE 's|^FROM (sqlc/sqlc:[0-9.]+@sha256:[0-9a-f]{64}) AS sqlc$|\1|p' .devcontainer/Dockerfile)
          if [[ -z $image ]]; then
            echo "::error::No pinned sqlc image in .devcontainer/Dockerfile"
            exit 1
          fi
          shopt -s nullglob
          configs=(apps/*/backend/sqlc.yaml apps/*/backend/sqlc.yml apps/*/backend/sqlc.json)
          if [[ ${#configs[@]} -eq 0 ]]; then
            echo "No apps/*/backend/sqlc config yet; nothing to check."
            exit 0
          fi
          failed=0
          for config in "${configs[@]}"; do
            dir=$(dirname "$config")
            echo "::group::$dir"
            if ! docker run --rm -v "$PWD:/src:ro" -w "/src/$dir" "$image" diff -f "$(basename "$config")"; then
              echo "::error file=$config::Generated code is out of date. Run sqlc generate in $dir."
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
