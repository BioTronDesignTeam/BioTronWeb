# Runs only when packages/style or something it depends on changes.
name: style

on:
  pull_request:
    paths:
      - packages/style/**
      - package-lock.json
      - go.work
  push:
    branches: [main]
    paths:
      - packages/style/**
      - package-lock.json
      - go.work

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/style
