# One workflow for every pull request and every push to main.
#
# The first job works out which parts of the repository the change touches.
# The build, test, and lint jobs then fan out, in parallel, only over those
# parts: a pull request that never touches Auth does not build Auth. Two
# shared pieces widen the fan-out on purpose: a change to packages/style or
# the root tooling rebuilds every frontend, and a change to go/, go.work, or
# the Go lint setup re-tests every backend. The secret and vulnerability
# scans run on every change regardless of what it touched.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository, and no step pushes, so no checkout
# keeps the token. Each action is pinned by commit SHA with its release in
# a comment; Dependabot moves both (.github/dependabot.yml).
permissions:
  contents: read

jobs:
  compose-config:
    name: runtime configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: validate Compose and launch without starting containers
        run: |
          for script in launch deploy/*.sh deploy/biotron-deploy infra/nginx/docker-entrypoint.d/*.sh; do bash -n "$script"; done
          python3 infra/tests/test-runtime-config.py

  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontends: ${{ steps.plan.outputs.frontends }}
      backends: ${{ steps.plan.outputs.backends }}
      shared: ${{ steps.plan.outputs.shared }}
      golangci-lint: ${{ steps.tools.outputs.golangci-lint }}
      trufflehog: ${{ steps.tools.outputs.trufflehog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            style:
              - 'packages/style/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.oxlintrc.json'
            gowork:
              - 'go.work'
              - 'go.work.sum'
              - 'go/**'
              - '.golangci.yml'
              - '.devcontainer/Dockerfile'
            site:
              - 'apps/site/**'
            calendar:
              - 'apps/calendar/**'
            status:
              - 'apps/status/**'
            auth:
              - 'apps/auth/**'
            exogui:
              - 'apps/exogui/**'
            sprinter:
              - 'apps/sprinter/**'
      - name: plan the fan-out
        id: plan
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          all='["site","calendar","status","auth","exogui","sprinter"]'
          with_backend='["calendar","status","auth","exogui","sprinter"]'
          changed_apps=$(jq -c --argjson all "$all" '[.[] | select(. as $x | $all | index($x) != null)]' <<<"$CHANGED")
          if jq -e 'index("style") != null' <<<"$CHANGED" >/dev/null; then
            frontends="$all"
          else
            frontends="$changed_apps"
          fi
          if jq -e 'index("gowork") != null' <<<"$CHANGED" >/dev/null; then
            backends="$with_backend"
            shared='["authclient","logclient"]'
          else
            backends=$(jq -c --argjson go "$with_backend" '[.[] | select(. as $x | $go | index($x) != null)]' <<<"$changed_apps")
            shared='[]'
          fi
          {
            echo "frontends=$frontends"
            echo "backends=$backends"
            echo "shared=$shared"
          } >> "$GITHUB_OUTPUT"
          echo "frontends: $frontends"
          echo "backends:  $backends"
          echo "shared:    $shared"
      # The tool releases of the devcontainer image, read from its FROM lines
      # (which Dependabot updates), so CI and ./pr-precheck run the same ones.
      - name: read tool versions
        id: tools
        run: |
          # tool OUTPUT IMAGE: the tag that .devcontainer/Dockerfile pins IMAGE to.
          tool() {
            local version
            version=$(sed -nE "s|^FROM $2:(v?[0-9]+\.[0-9]+\.[0-9]+)@sha256:.*|\1|p" .devcontainer/Dockerfile)
            if [[ ! $version =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::No single $2 version in .devcontainer/Dockerfile"
              exit 1
            fi
            echo "$1=$version" | tee -a "$GITHUB_OUTPUT"
          }
          tool golangci-lint golangci/golangci-lint
          tool trufflehog trufflesecurity/trufflehog

  frontend:
    name: frontend ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.frontends != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.frontends) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Only this app, the shared library, and the root lint tooling. Scripts
      # stay off, as in the Dockerfiles: the library is built explicitly.
      - run: npm ci --ignore-scripts --include-workspace-root --workspace packages/style --workspace apps/${{ matrix.app }}/frontend
      - run: npm run build -w packages/style
      - run: npm run build -w apps/${{ matrix.app }}/frontend
      # Oxlint reads .oxlintrc.json at the root; type-aware rules resolve
      # through the app's own tsconfig.
      - run: npx oxlint apps/${{ matrix.app }}/frontend/src

  backend:
    name: backend ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.backends != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.backends) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/${{ matrix.app }}/backend/go.mod
          cache-dependency-path: apps/${{ matrix.app }}/backend/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ needs.changes.outputs.golangci-lint }}
          working-directory: apps/${{ matrix.app }}/backend
      - run: go vet ./...
      - run: go test ./...

  # The shared Go modules under go/, which every backend builds through
  # go.work.
  shared:
    name: go/${{ matrix.module }}
    needs: changes
    if: needs.changes.outputs.shared != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.shared) }}
    defaults:
      run:
        working-directory: go/${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/${{ matrix.module }}/go.mod
          cache-dependency-path: go/${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ needs.changes.outputs.golangci-lint }}
          working-directory: go/${{ matrix.module }}
      - run: go vet ./...
      - run: go test ./...

  secrets:
    name: secrets (TruffleHog)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Scans the commits the change adds and fails on any verified live
      # credential, or one whose check errored (unknown). Unverified results
      # are excluded on purpose, and only the --results flag excludes them:
      # without it every finding fails the job. Every unverified one so far is
      # a Postgres URL on an internal host (postgres:5432, db:5432), which CI
      # can never resolve, so a placeholder and a real one look the same to
      # the scanner. The token types that matter (GitHub, Cloudflare,
      # Discord, AWS) verify against their provider and do gate.
      # The action runs the TruffleHog image of the version it is given (the
      # latest by default), so it gets the one of the devcontainer.
      - uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          version: ${{ needs.changes.outputs.trufflehog }}
          extra_args: --results=verified,unknown

  vulnerabilities:
    name: vulnerabilities (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lockfiles, go.sum files, Dockerfiles, and compose files. Fails on a
      # fixable HIGH or CRITICAL finding; unfixable ones are reported only.
      # Accepted findings live in .trivyignore.yaml with their reasons; Trivy
      # only reads the YAML form when it is named explicitly.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml

  # The one check the main ruleset requires. The build and test jobs above
  # only exist for the parts a change touches, so they cannot be required by
  # name; this job waits for all of them and fails if any failed or was
  # cancelled. A skipped job (nothing to build) counts as passing.
  passed:
    name: ci passed
    if: always()
    needs: [compose-config, changes, frontend, backend, logclient, secrets, vulnerabilities]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case $result in success|skipped) ;; *) exit 1 ;; esac
          done
