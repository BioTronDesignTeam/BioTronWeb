# Runs only when apps/sprinter or something it depends on changes.
name: sprinter

on:
  pull_request:
    paths:
      - apps/sprinter/**
      - packages/style/**
      - go/**
      - package-lock.json
      - go.work
  push:
    branches: [main]
    paths:
      - apps/sprinter/**
      - packages/style/**
      - go/**
      - package-lock.json
      - go.work

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/sprinter/frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go vet ./... && go test ./...
        working-directory: apps/sprinter/backend
