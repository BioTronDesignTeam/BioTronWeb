# Runs only when apps/site or something it depends on changes.
name: site

on:
  pull_request:
    paths:
      - apps/site/**
      - packages/style/**
      - package-lock.json
      - go.work
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/style/**
      - package-lock.json
      - go.work

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/site/frontend
