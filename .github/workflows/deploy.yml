# A push to main builds and scans every image, tags it with the commit, and
# deploys it to staging. A v* tag on a commit that staging already deployed
# sends those same images to production without rebuilding. Running this
# workflow by hand on an older tag rolls production back to it.
name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: site-web, context: ., dockerfile: apps/site/frontend/Dockerfile }
          - { name: calendar-web, context: ., dockerfile: apps/calendar/frontend/Dockerfile }
          - { name: calendar-api, context: ., dockerfile: apps/calendar/backend/Dockerfile }
          - { name: calendar-migrate, context: apps/calendar/prisma, dockerfile: apps/calendar/prisma/Dockerfile }
          - { name: logger-web, context: ., dockerfile: apps/logger/frontend/Dockerfile }
          - { name: logger-api, context: ., dockerfile: apps/logger/backend/Dockerfile }
          - { name: logger-migrate, context: apps/logger/prisma, dockerfile: apps/logger/prisma/Dockerfile }
          - { name: auth-web, context: ., dockerfile: apps/auth/frontend/Dockerfile }
          - { name: auth-api, context: ., dockerfile: apps/auth/backend/Dockerfile }
          - { name: auth-migrate, context: apps/auth/prisma, dockerfile: apps/auth/prisma/Dockerfile }
          - { name: exo-web, context: ., dockerfile: apps/exo/frontend/Dockerfile }
          - { name: exo-api, context: ., dockerfile: apps/exo/backend/Dockerfile }
          - { name: exo-migrate, context: apps/exo/prisma, dockerfile: apps/exo/prisma/Dockerfile }
          - { name: sprinter-web, context: ., dockerfile: apps/sprinter/frontend/Dockerfile }
          - { name: sprinter-bot, context: ., dockerfile: apps/sprinter/backend/Dockerfile }
          - { name: sprinter-migrate, context: apps/sprinter/prisma, dockerfile: apps/sprinter/prisma/Dockerfile }
          - { name: edge-nginx, context: infra/nginx, dockerfile: infra/nginx/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/biotrondesignteam/${{ matrix.image.name }}:${{ github.sha }}
          build-args: |
            VITE_SITE_URL=https://__BASE_DOMAIN__
            VITE_CALENDAR_API_URL=https://calendar.__BASE_DOMAIN__/api
            VITE_API_BASE=/api
            VITE_API_URL=/api
            VITE_AUTH_URL=https://auth.__BASE_DOMAIN__/api
            VITE_IDP_URL=https://auth.__BASE_DOMAIN__/api
            VITE_CALENDAR_URL=${{ matrix.image.name == 'sprinter-web' && 'https://calendar.__BASE_DOMAIN__/api' || 'https://calendar.__BASE_DOMAIN__' }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/biotrondesignteam/${{ matrix.image.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the commit whose images to deploy
        id: resolve
        run: |
          set -euo pipefail
          revision=$(git rev-parse "$GITHUB_SHA^{commit}")
          case $GITHUB_REF in
            refs/heads/main) ;;
            refs/tags/v*)
              [[ $GITHUB_REF_NAME =~ ^v[0-9A-Za-z.-]+$ ]] || { echo 'Release tags may use only letters, digits, dots and dashes' >&2; exit 1; }
              git fetch origin main
              git merge-base --is-ancestor "$revision" origin/main || { echo "$GITHUB_REF_NAME is not a commit on main" >&2; exit 1; }
              result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?head_sha=$revision&branch=main&status=success&per_page=1" --jq '.total_count')
              [[ $result -gt 0 ]] || { echo "No successful staging deployment of $revision; tag a commit that staging deployed" >&2; exit 1; }
              ;;
            *) echo 'Deploy runs only from main or a v* tag' >&2; exit 1 ;;
          esac
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: [candidate, images]
    if: always() && needs.candidate.result == 'success' && (needs.images.result == 'success' || (startsWith(github.ref, 'refs/tags/') && needs.images.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      INSTANCE: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
      # deploy-staging may deploy only staging, deploy-prod only prod and the
      # edge (deploy/README.md), so a staging run cannot touch production.
      DEPLOY_USER: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
      REVISION: ${{ needs.candidate.outputs.revision }}
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          # Each environment has its own Tailscale identity and tag, which may
          # log in only as that environment's account on the host.
          tags: tag:biotron-ci-${{ env.INSTANCE }}
      # The host keeps no checkout and no .env files. biotron-deploy downloads
      # this commit's Compose files, checks the commit is on main (and, for
      # prod, that a v* tag names it), fetches the instance's settings from
      # Infisical, and pulls the tested images.
      - name: Deploy the instance
        run: |
          [[ $DEPLOY_HOST =~ ^[a-zA-Z0-9.-]+$ && $REVISION =~ ^[0-9a-f]{40}$ ]] || exit 1
          tailscale ssh "$DEPLOY_USER@$DEPLOY_HOST" sudo /usr/local/sbin/biotron-deploy "$INSTANCE" "$REVISION"
      # One edge serves every instance on a host, so only one environment per
      # host updates it: production while staging and production share a host.
      - name: Deploy the shared edge
        if: vars.DEPLOY_EDGE == 'true'
        run: tailscale ssh "$DEPLOY_USER@$DEPLOY_HOST" sudo /usr/local/sbin/biotron-deploy edge "$REVISION"
