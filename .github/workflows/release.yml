# Builds every image once for linux/amd64 and linux/arm64, tags each by
# digest, and records the digests in infra/manifests/staging.yml. Production
# deploys copy the approved digests from staging; nothing is rebuilt.
name: release

on:
  push:
    tags: ['v*']

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        image:
          - { name: site-web,      dockerfile: apps/site/frontend/Dockerfile }
          - { name: calendar-web,  dockerfile: apps/calendar/frontend/Dockerfile }
          - { name: calendar-api,  dockerfile: apps/calendar/backend/Dockerfile }
          - { name: logger-web,    dockerfile: apps/logger/frontend/Dockerfile }
          - { name: logger-api,    dockerfile: apps/logger/backend/Dockerfile }
          - { name: auth-web,      dockerfile: apps/auth/frontend/Dockerfile }
          - { name: auth-api,      dockerfile: apps/auth/backend/Dockerfile }
          - { name: exo-web,       dockerfile: apps/exo/frontend/Dockerfile }
          - { name: exo-api,       dockerfile: apps/exo/backend/Dockerfile }
          - { name: sprinter-web,  dockerfile: apps/sprinter/frontend/Dockerfile }
          - { name: sprinter-bot,  dockerfile: apps/sprinter/backend/Dockerfile }
          - { name: edge-nginx,    dockerfile: infra/nginx/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/biotrondesignteam/${{ matrix.image.name }}:${{ github.ref_name }}
