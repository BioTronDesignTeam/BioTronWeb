name: biotron-status

services:
  status-migrate:
    # The one migrate image (infra/migrate), applying this app's migrations.
    image: ${IMAGE_REGISTRY:-biotron-}migrate:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/migrate/Dockerfile
    command: ["status"]
    environment:
      DATABASE_URL: ${STATUS_DATABASE_URL:-${DATABASE_URL:-}}
    networks:
      - biotron
    restart: "no"

  status-api:
    image: ${IMAGE_REGISTRY:-biotron-}status-api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/status/backend/Dockerfile
    environment:
      DATABASE_URL: ${STATUS_DATABASE_URL:-${DATABASE_URL:-}}
      TRUSTED_PROXIES: ${STATUS_TRUSTED_PROXIES:-${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}}
      HEALTH_INTERVAL: ${STATUS_HEALTH_INTERVAL:-${HEALTH_INTERVAL:-15s}}
      HEALTH_HISTORY_INTERVAL: ${STATUS_HEALTH_HISTORY_INTERVAL:-${HEALTH_HISTORY_INTERVAL:-5m}}
      HEALTH_TIMEOUT: ${STATUS_HEALTH_TIMEOUT:-${HEALTH_TIMEOUT:-3s}}
      STATUS_CACHE_TTL: ${STATUS_STATUS_CACHE_TTL:-${STATUS_CACHE_TTL:-30s}}
      STATUS_RATE_LIMIT: ${STATUS_STATUS_RATE_LIMIT:-${STATUS_RATE_LIMIT:-60}}
      STATUS_CATALOG_JSON: ${STATUS_STATUS_CATALOG_JSON:-${STATUS_CATALOG_JSON:-}}
      GRAFANA_OTLP_ENDPOINT: ${STATUS_GRAFANA_OTLP_ENDPOINT:-${GRAFANA_OTLP_ENDPOINT:-}}
      GRAFANA_OTLP_USER: ${STATUS_GRAFANA_OTLP_USER:-${GRAFANA_OTLP_USER:-}}
      GRAFANA_OTLP_TOKEN: ${STATUS_GRAFANA_OTLP_TOKEN:-${GRAFANA_OTLP_TOKEN:-}}
      POSTHOG_HOST: ${STATUS_POSTHOG_HOST:-${POSTHOG_HOST:-}}
      POSTHOG_API_KEY: ${STATUS_POSTHOG_API_KEY:-${POSTHOG_API_KEY:-}}
      BIOTRON_ENV: ${STATUS_BIOTRON_ENV:-${BIOTRON_ENV:-}}
      LOG_LEVEL: ${STATUS_LOG_LEVEL:-${LOG_LEVEL:-info}}
      PORT: "8080"
    ports:
      - "127.0.0.1:${STATUS_API_PORT:-${API_PORT:-8082}}:8080"
    networks:
      biotron:
        aliases:
          - status-api
          - ${BIOTRON_INSTANCE:-local}-status-api
    depends_on:
      status-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  status-web:
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    image: ${IMAGE_REGISTRY:-biotron-}status-web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/status/frontend/Dockerfile
      args:
        VITE_API_URL: ${STATUS_VITE_API_URL:-${VITE_API_URL:-/api}}
    ports:
      - "127.0.0.1:${STATUS_WEB_PORT:-${WEB_PORT:-5175}}:80"
    networks:
      biotron:
        aliases:
          - status-web
          - ${BIOTRON_INSTANCE:-local}-status-web
    depends_on:
      - status-api
    restart: unless-stopped

networks:
  biotron:
    external: true
    name: ${BIOTRON_NETWORK:-biotron}
