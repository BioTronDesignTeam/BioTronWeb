name: biotron-oauth-manager

services:
  auth-migrate:
    image: ${IMAGE_REGISTRY:-biotron-}auth-migrate:${IMAGE_TAG:-local}
    build:
      context: ./prisma
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-${DATABASE_URL:-}}
    networks:
      - biotron
    restart: "no"

  auth-api:
    image: ${IMAGE_REGISTRY:-biotron-}auth-api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/auth/backend/Dockerfile
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-${DATABASE_URL:-}}
      GITHUB_ORG: ${AUTH_GITHUB_ORG:-${GITHUB_ORG:-BioTronDesignTeam}}
      OAUTH_CALLBACK_URL: ${AUTH_OAUTH_CALLBACK_URL:-${OAUTH_CALLBACK_URL:-http://localhost:8080/auth/github/callback}}
      FRONTEND_URL: ${AUTH_FRONTEND_URL:-${FRONTEND_URL:-http://localhost:5173}}
      CORS_ORIGINS: ${AUTH_CORS_ORIGINS:-${CORS_ORIGINS:-}}
      COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-${COOKIE_SECURE:-false}}
      COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-${COOKIE_SAMESITE:-Lax}}
      COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-${COOKIE_DOMAIN:-}}
      SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-${SESSION_TTL_HOURS:-168}}
      SUPERUSER_GITHUB_IDS: ${AUTH_SUPERUSER_GITHUB_IDS:-${SUPERUSER_GITHUB_IDS:-}}
      TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}}
      LOGGER_URL: ${AUTH_LOGGER_URL:-${LOGGER_URL:-http://logger-api:8080}}
      LOGGER_INGEST_TOKEN: ${LOGGER_INGEST_TOKEN:-}
      LOG_LEVEL: ${AUTH_LOG_LEVEL:-${LOG_LEVEL:-info}}
      GITHUB_APP_ID: ${AUTH_GITHUB_APP_ID:-${GITHUB_APP_ID:-}}
      GITHUB_APP_CLIENT_ID: ${AUTH_GITHUB_APP_CLIENT_ID:-${GITHUB_APP_CLIENT_ID:-}}
      GITHUB_APP_CLIENT_SECRET: ${AUTH_GITHUB_APP_CLIENT_SECRET:-${GITHUB_APP_CLIENT_SECRET:-}}
      GITHUB_APP_PRIVATE_KEY: ${AUTH_GITHUB_APP_PRIVATE_KEY:-${GITHUB_APP_PRIVATE_KEY:-}}
      SESSION_SIGNING_KEY: ${AUTH_SESSION_SIGNING_KEY:-${SESSION_SIGNING_KEY:-}}
      GRAFANA_OTLP_ENDPOINT: ${AUTH_GRAFANA_OTLP_ENDPOINT:-${GRAFANA_OTLP_ENDPOINT:-}}
      GRAFANA_OTLP_USER: ${AUTH_GRAFANA_OTLP_USER:-${GRAFANA_OTLP_USER:-}}
      GRAFANA_OTLP_TOKEN: ${AUTH_GRAFANA_OTLP_TOKEN:-${GRAFANA_OTLP_TOKEN:-}}
      POSTHOG_HOST: ${AUTH_POSTHOG_HOST:-${POSTHOG_HOST:-}}
      POSTHOG_API_KEY: ${AUTH_POSTHOG_API_KEY:-${POSTHOG_API_KEY:-}}
      BIOTRON_ENV: ${AUTH_BIOTRON_ENV:-${BIOTRON_ENV:-}}
      PORT: "8080"
    ports:
      - "127.0.0.1:${AUTH_API_PORT:-${API_PORT:-8080}}:8080"
    networks:
      biotron:
        aliases:
          - oauth-manager
          - ${BIOTRON_INSTANCE:-local}-oauth-manager
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  auth-web:
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    image: ${IMAGE_REGISTRY:-biotron-}auth-web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/auth/frontend/Dockerfile
      args:
        VITE_API_BASE: ${AUTH_VITE_API_BASE:-${VITE_API_BASE:-http://localhost:8080}}
    ports:
      - "127.0.0.1:${AUTH_WEB_PORT:-${WEB_PORT:-5173}}:80"
    networks:
      biotron:
        aliases:
          - oauth-web
          - ${BIOTRON_INSTANCE:-local}-oauth-web
    depends_on:
      - auth-api
    restart: unless-stopped

networks:
  biotron:
    external: true
    name: ${BIOTRON_NETWORK:-biotron}
