name: biotron-logger

services:
  logger-migrate:
    image: ${IMAGE_REGISTRY:-biotron-}logger-migrate:${IMAGE_TAG:-local}
    build:
      context: ./prisma
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${LOGGER_DATABASE_URL:-${DATABASE_URL:-}}
    networks:
      - biotron
    restart: "no"

  logger-api:
    image: ${IMAGE_REGISTRY:-biotron-}logger-api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/logger/backend/Dockerfile
    environment:
      DATABASE_URL: ${LOGGER_DATABASE_URL:-${DATABASE_URL:-}}
      REDIS_URL: ${LOGGER_REDIS_URL:-${REDIS_URL:-redis://redis:6379/0}}
      LOGGER_INGEST_TOKEN: ${LOGGER_INGEST_TOKEN:-}
      OAUTH_MANAGER_URL: ${LOGGER_OAUTH_MANAGER_URL:-${OAUTH_MANAGER_URL:-http://oauth-manager:8080}}
      TRUSTED_PROXIES: ${LOGGER_TRUSTED_PROXIES:-${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}}
      REDIS_TAIL_SIZE: ${LOGGER_REDIS_TAIL_SIZE:-${REDIS_TAIL_SIZE:-500}}
      HEALTH_INTERVAL: ${LOGGER_HEALTH_INTERVAL:-${HEALTH_INTERVAL:-15s}}
      HEALTH_HISTORY_INTERVAL: ${LOGGER_HEALTH_HISTORY_INTERVAL:-${HEALTH_HISTORY_INTERVAL:-5m}}
      HEALTH_TIMEOUT: ${LOGGER_HEALTH_TIMEOUT:-${HEALTH_TIMEOUT:-3s}}
      STATUS_CACHE_TTL: ${LOGGER_STATUS_CACHE_TTL:-${STATUS_CACHE_TTL:-30s}}
      STATUS_RATE_LIMIT: ${LOGGER_STATUS_RATE_LIMIT:-${STATUS_RATE_LIMIT:-60}}
      INGEST_RATE_LIMIT: ${LOGGER_INGEST_RATE_LIMIT:-${INGEST_RATE_LIMIT:-600}}
      LOGGER_CATALOG_JSON: ${LOGGER_LOGGER_CATALOG_JSON:-${LOGGER_CATALOG_JSON:-}}
      PORT: "8080"
    ports:
      - "127.0.0.1:${LOGGER_API_PORT:-${API_PORT:-8082}}:8080"
    networks:
      biotron:
        aliases:
          - logger-api
          - ${BIOTRON_INSTANCE:-local}-logger-api
    depends_on:
      logger-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  logger-web:
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    image: ${IMAGE_REGISTRY:-biotron-}logger-web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/logger/frontend/Dockerfile
      args:
        VITE_API_URL: ${LOGGER_VITE_API_URL:-${VITE_API_URL:-/api}}
    ports:
      - "127.0.0.1:${LOGGER_WEB_PORT:-${WEB_PORT:-5175}}:80"
    networks:
      biotron:
        aliases:
          - logger-web
          - ${BIOTRON_INSTANCE:-local}-logger-web
    depends_on:
      - logger-api
    restart: unless-stopped

networks:
  biotron:
    external: true
    name: ${BIOTRON_NETWORK:-biotron}
