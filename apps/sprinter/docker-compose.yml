name: biotron-sprinter

services:
  sprinter-migrate:
    build:
      context: ./prisma
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    networks:
      - biotron
    restart: "no"

  sprinter-bot:
    build:
      context: ../..
      dockerfile: apps/sprinter/backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      READ_DATABASE_URL: ${READ_DATABASE_URL:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      THREAD_MAX_TURNS: ${THREAD_MAX_TURNS:-40}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-2m}
      POLL_INTERVAL: ${POLL_INTERVAL:-5m}
      CALENDAR_URL: ${CALENDAR_URL:-http://calendar-api:8080}
      OAUTH_MANAGER_URL: ${OAUTH_MANAGER_URL:-http://oauth-manager:8080}
      LOGGER_URL: ${LOGGER_URL:-http://logger-api:8080}
      LOGGER_INGEST_TOKEN: ${LOGGER_INGEST_TOKEN:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5178}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1}
      PORT: "8080"
    ports:
      - "127.0.0.1:${API_PORT:-8084}:8080"
    networks:
      biotron:
        aliases:
          - sprinter
    depends_on:
      sprinter-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  sprinter-web:
    build:
      context: ../..
      dockerfile: apps/sprinter/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8084}
        VITE_AUTH_URL: ${VITE_AUTH_URL:-http://localhost:8080}
        VITE_CALENDAR_URL: ${VITE_CALENDAR_URL:-http://localhost:8083}
    ports:
      - "127.0.0.1:${WEB_PORT:-5178}:80"
    networks:
      biotron:
        aliases:
          - sprinter-web
    depends_on:
      - sprinter-bot
    restart: unless-stopped

networks:
  biotron:
    external: true
    name: biotron
