name: biotron-exo-gui

services:
  exo-migrate:
    image: ${IMAGE_REGISTRY:-biotron-}exo-migrate:${IMAGE_TAG:-local}
    build:
      context: ./prisma
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${EXO_DATABASE_URL:-${DATABASE_URL:-}}
    networks:
      - biotron
    restart: "no"

  exo-api:
    image: ${IMAGE_REGISTRY:-biotron-}exo-api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/exo/backend/Dockerfile
    environment:
      DATABASE_URL: ${EXO_DATABASE_URL:-${DATABASE_URL:-}}
      OAUTH_MANAGER_URL: ${EXO_OAUTH_MANAGER_URL:-${OAUTH_MANAGER_URL:-http://oauth-manager:8080}}
      PORT: "8080"
      FRONTEND_URL: ${EXO_FRONTEND_URL:-${FRONTEND_URL:-http://localhost:5174}}
      TRUSTED_PROXIES: ${EXO_TRUSTED_PROXIES:-${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}}
      GRAFANA_OTLP_ENDPOINT: ${EXO_GRAFANA_OTLP_ENDPOINT:-${GRAFANA_OTLP_ENDPOINT:-}}
      GRAFANA_OTLP_USER: ${EXO_GRAFANA_OTLP_USER:-${GRAFANA_OTLP_USER:-}}
      GRAFANA_OTLP_TOKEN: ${EXO_GRAFANA_OTLP_TOKEN:-${GRAFANA_OTLP_TOKEN:-}}
      POSTHOG_HOST: ${EXO_POSTHOG_HOST:-${POSTHOG_HOST:-}}
      POSTHOG_API_KEY: ${EXO_POSTHOG_API_KEY:-${POSTHOG_API_KEY:-}}
      BIOTRON_ENV: ${EXO_BIOTRON_ENV:-${BIOTRON_ENV:-}}
      LOG_LEVEL: ${EXO_LOG_LEVEL:-${LOG_LEVEL:-info}}
    ports:
      - "127.0.0.1:${EXO_API_PORT:-${API_PORT:-8081}}:8080"
    networks:
      biotron:
        aliases:
          - exo-api
          - ${BIOTRON_INSTANCE:-local}-exo-api
    depends_on:
      exo-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  exo-web:
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    image: ${IMAGE_REGISTRY:-biotron-}exo-web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/exo/frontend/Dockerfile
      args:
        VITE_API_URL: ${EXO_VITE_API_URL:-${VITE_API_URL:-http://localhost:8081}}
        VITE_AUTH_URL: ${EXO_VITE_AUTH_URL:-${VITE_AUTH_URL:-http://localhost:8080}}
    ports:
      - "127.0.0.1:${EXO_WEB_PORT:-${WEB_PORT:-5174}}:80"
    networks:
      biotron:
        aliases:
          - exo-web
          - ${BIOTRON_INSTANCE:-local}-exo-web
    depends_on:
      - exo-api
    restart: unless-stopped

networks:
  biotron:
    external: true
    name: ${BIOTRON_NETWORK:-biotron}
