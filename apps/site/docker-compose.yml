name: biotron-site

services:
  site-web:
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    image: ${IMAGE_REGISTRY:-biotron-}site-web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/site/frontend/Dockerfile
      args:
        VITE_CALENDAR_API_URL: ${VITE_CALENDAR_API_URL:-http://localhost:8083}
        VITE_CALENDAR_URL: ${VITE_CALENDAR_URL:-http://localhost:5176}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5177}
        VITE_GOOGLE_SITE_VERIFICATION: ${VITE_GOOGLE_SITE_VERIFICATION:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-5177}:80"
    networks:
      biotron:
        aliases:
          - site-web
    restart: unless-stopped

networks:
  biotron:
    external: true
    name: biotron
