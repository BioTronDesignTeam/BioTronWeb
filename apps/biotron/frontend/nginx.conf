server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind the edge this server does not know its public name or port, so a
    # redirect must carry a path only, and the browser keeps the host it used.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # nginx's add_header does not merge across levels: as soon as a location
    # declares one, it drops every add_header inherited from the server block.
    # Both locations below need a Cache-Control, so both must repeat these three
    # or they serve no security headers at all. That is not hypothetical — the
    # SPA fallback rewrites to /index.html, which lands in the exact-match block
    # below, so a single unrepeated add_header stripped these from every
    # response the site served. Repeat them in any location you add.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Vite hashed assets — cache forever.
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # One Cache-Control only. `expires 1y` emits its own, so pairing it with
        # an explicit add_header sent the header twice on every asset.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The build writes one index.html for every real page (see seo-plugin.ts),
    # so a path is served only when its file exists. Anything else is a true
    # 404: the status tells search engines the page is gone, and the body is
    # the app shell, which draws the not-found page. `$uri/index.html` rather
    # than `$uri/` serves /join as it is, where the latter would redirect to
    # /join/ and split every page across two addresses.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";
    }

    # One address for each page: /join/ goes to /join.
    location ~ ^/(.+)/$ {
        return 301 /$1;
    }

    # The old address of the past-projects list. The app redirected it in the
    # browser; with no file behind it, the server has to.
    location = /past-projects {
        return 301 /projects#past;
    }

    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";
    }
}
