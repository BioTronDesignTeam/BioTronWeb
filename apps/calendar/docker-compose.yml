name: biotron-calendar

services:
  calendar-migrate:
    image: ${IMAGE_REGISTRY:-biotron-}calendar-migrate:${IMAGE_TAG:-local}
    build:
      context: ./prisma
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${CALENDAR_DATABASE_URL:-${DATABASE_URL:-}}
    networks:
      - biotron
    restart: "no"

  calendar-api:
    image: ${IMAGE_REGISTRY:-biotron-}calendar-api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/calendar/backend/Dockerfile
    environment:
      DATABASE_URL: ${CALENDAR_DATABASE_URL:-${DATABASE_URL:-}}
      FRONTEND_URL: ${CALENDAR_FRONTEND_URL:-${FRONTEND_URL:-http://localhost:5176}}
      SITE_URL: ${CALENDAR_SITE_URL:-${SITE_URL:-http://localhost:5177}}
      VITE_API_URL: ${CALENDAR_VITE_API_URL:-${VITE_API_URL:-http://localhost:8083}}
      PUBLIC_BASE_URL: ${CALENDAR_PUBLIC_BASE_URL:-${PUBLIC_BASE_URL:-}}
      OAUTH_MANAGER_URL: ${CALENDAR_OAUTH_MANAGER_URL:-${OAUTH_MANAGER_URL:-http://oauth-manager:8080}}
      CORS_ORIGINS: ${CALENDAR_CORS_ORIGINS:-${CORS_ORIGINS:-}}
      ADMIN_CORS_ORIGINS: ${CALENDAR_ADMIN_CORS_ORIGINS:-${ADMIN_CORS_ORIGINS:-}}
      DEFAULT_TIMEZONE: ${CALENDAR_DEFAULT_TIMEZONE:-${DEFAULT_TIMEZONE:-America/Toronto}}
      MAX_RANGE_DAYS: ${CALENDAR_MAX_RANGE_DAYS:-${MAX_RANGE_DAYS:-370}}
      LOGGER_URL: ${CALENDAR_LOGGER_URL:-${LOGGER_URL:-http://logger-api:8080}}
      LOGGER_INGEST_TOKEN: ${LOGGER_INGEST_TOKEN:-}
      GRAFANA_OTLP_ENDPOINT: ${CALENDAR_GRAFANA_OTLP_ENDPOINT:-${GRAFANA_OTLP_ENDPOINT:-}}
      GRAFANA_OTLP_USER: ${CALENDAR_GRAFANA_OTLP_USER:-${GRAFANA_OTLP_USER:-}}
      GRAFANA_OTLP_TOKEN: ${CALENDAR_GRAFANA_OTLP_TOKEN:-${GRAFANA_OTLP_TOKEN:-}}
      POSTHOG_HOST: ${CALENDAR_POSTHOG_HOST:-${POSTHOG_HOST:-}}
      POSTHOG_API_KEY: ${CALENDAR_POSTHOG_API_KEY:-${POSTHOG_API_KEY:-}}
      BIOTRON_ENV: ${CALENDAR_BIOTRON_ENV:-${BIOTRON_ENV:-}}
      LOG_LEVEL: ${CALENDAR_LOG_LEVEL:-${LOG_LEVEL:-info}}
      PORT: "8080"
    ports:
      - "127.0.0.1:${CALENDAR_API_PORT:-${API_PORT:-8083}}:8080"
    networks:
      biotron:
        aliases:
          - calendar-api
          - ${BIOTRON_INSTANCE:-local}-calendar-api
    depends_on:
      calendar-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  calendar-web:
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    image: ${IMAGE_REGISTRY:-biotron-}calendar-web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/calendar/frontend/Dockerfile
      args:
        VITE_API_URL: ${CALENDAR_VITE_API_URL:-${VITE_API_URL:-http://localhost:8083}}
        VITE_AUTH_URL: ${CALENDAR_VITE_AUTH_URL:-${VITE_AUTH_URL:-http://localhost:8080}}
    ports:
      - "127.0.0.1:${CALENDAR_WEB_PORT:-${WEB_PORT:-5176}}:80"
    networks:
      biotron:
        aliases:
          - calendar-web
          - ${BIOTRON_INSTANCE:-local}-calendar-web
    depends_on:
      - calendar-api
    restart: unless-stopped

networks:
  biotron:
    external: true
    name: ${BIOTRON_NETWORK:-biotron}
