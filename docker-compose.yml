name: biotron-sprinter

services:
  migrate:
    build:
      context: ./prisma
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    networks:
      - biotron
    restart: "no"

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      PORT: "8080"
    ports:
      - "127.0.0.1:${API_PORT:-18083}:8080"
    networks:
      - biotron
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:18083}
    ports:
      - "127.0.0.1:${WEB_PORT:-5176}:80"
    networks:
      - biotron
    depends_on:
      - bot
    restart: unless-stopped

networks:
  biotron:
    external: true
    name: biotron
