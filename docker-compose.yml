name: biotron-logger

services:
  migrate:
    build:
      context: ./prisma
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    networks:
      - biotron
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${API_PORT:-18081}:8080"
    networks:
      - biotron
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:18081}
    ports:
      - "127.0.0.1:${WEB_PORT:-5175}:80"
    networks:
      - biotron
    depends_on:
      - api
    restart: unless-stopped

networks:
  biotron:
    external: true
    name: biotron
