# The six products from one place. `docker compose up -d --build` here builds
# and starts every app; each included file still works on its own from its
# folder, and each needs its own .env beside it (copy .env.example).
#
# infra/ is not included on purpose: it owns the Postgres data, Redis, and the
# edge, and it outlives any app deploy. Start it first, on its own:
#
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
#
# It creates the external `biotron` network every app below joins.
name: biotron

include:
  - path: apps/site/docker-compose.yml
    project_directory: apps/site
    env_file: apps/site/.env
  - path: apps/calendar/docker-compose.yml
    project_directory: apps/calendar
    env_file: apps/calendar/.env
  - path: apps/logger/docker-compose.yml
    project_directory: apps/logger
    env_file: apps/logger/.env
  - path: apps/auth/docker-compose.yml
    project_directory: apps/auth
    env_file: apps/auth/.env
  - path: apps/exo/docker-compose.yml
    project_directory: apps/exo
    env_file: apps/exo/.env
  - path: apps/sprinter/docker-compose.yml
    project_directory: apps/sprinter
    env_file: apps/sprinter/.env
