# One instance of the platform: its Postgres, then the six apps.
# Locally the project is `biotron`; `./launch --instance staging` runs the same
# files as `biotron-staging`, with its own network, volumes, and settings.
# App .env files are optional for local development. Runtime deployment
# uses /dev/null and supplies prefixed process variables.
# The edge and Infisical have independent lifecycles and are not included here.
name: biotron

include:
  - path: infra/docker-compose.yml
    project_directory: infra
    env_file: ${INFRA_ENV_FILE:-/dev/null}
  - path: apps/biotron/docker-compose.yml
    project_directory: apps/biotron
    env_file: ${BIOTRON_ENV_FILE:-/dev/null}
  - path: apps/calendar/docker-compose.yml
    project_directory: apps/calendar
    env_file: ${CALENDAR_ENV_FILE:-/dev/null}
  - path: apps/status/docker-compose.yml
    project_directory: apps/status
    env_file: ${STATUS_ENV_FILE:-/dev/null}
  - path: apps/auth/docker-compose.yml
    project_directory: apps/auth
    env_file: ${AUTH_ENV_FILE:-/dev/null}
  - path: apps/exogui/docker-compose.yml
    project_directory: apps/exogui
    env_file: ${EXOGUI_ENV_FILE:-/dev/null}
  - path: apps/sprinter/docker-compose.yml
    project_directory: apps/sprinter
    env_file: ${SPRINTER_ENV_FILE:-/dev/null}
