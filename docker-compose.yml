name: biotron-oauth-manager

services:
  migrate:
    build:
      context: ./prisma
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    networks:
      - biotron
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: "8080"
      FRONTEND_URL: http://localhost:${WEB_PORT:-5173}
      OAUTH_CALLBACK_URL: http://localhost:${API_PORT:-18080}/auth/github/callback
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    networks:
      biotron:
        aliases:
          - oauth-manager
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:18080}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    networks:
      - biotron
    depends_on:
      - api
    restart: unless-stopped

networks:
  biotron:
    external: true
    name: biotron
