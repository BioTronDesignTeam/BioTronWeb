name: biotron-site

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: biotron-site:latest
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      biotron:
        aliases:
          - site-web
    restart: unless-stopped

networks:
  biotron:
    external: true
    name: biotron
